name: hermes-iroh-gateway
version: 0.1.0
manifest_version: 2
api_version: 1
description: >-
  Manage an embedded iroh content-addressed HTTP gateway from Hermes —
  start/stop/configure the node, expose Python agent tools, a dashboard/
  desktop backend (FastAPI), and a native desktop control pane.
author: Malcolm
license: MIT
homepage: https://github.com/Metta-AI/hermes-iroh-gateway
tags: [iroh, gateway, p2p, blobs, content-addressed, desktop]

provides_tools:
  - iroh_gateway_status
  - iroh_gateway_start
  - iroh_gateway_stop
  - iroh_gateway_put

# Declaration-only (surfaced by `hermes plugins doctor`, never auto-installed).
# Prefer pyproject.toml as the source of truth; kept here too per the v2 schema
# so `hermes plugins install`/`doctor` can surface it without parsing TOML.
python_dependencies:
  - "iroh>=0.35,<1.0"
  - "fastapi>=0.110"
